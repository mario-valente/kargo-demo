apiVersion: apps/v1
kind: Deployment
metadata:
  name: kargo-demo
  labels:
    app: kargo-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kargo-demo
  template:
    metadata:
      labels:
        app: kargo-demo
    spec:
      containers:
        - name: kargo-demo
          image: public.ecr.aws/nginx/nginx:1.29.0
          ports:
            - containerPort: 80
