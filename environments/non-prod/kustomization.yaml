apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: kargo-demo-non-prod
resources:
- ../../base
patches:
- target:
    kind: Deployment
    name: kargo-demo
  patch: |-
    - op: replace
      path: /spec/replicas
      value: 1
images:
- name: public.ecr.aws/nginx/nginx
  newTag: 1.29.8
