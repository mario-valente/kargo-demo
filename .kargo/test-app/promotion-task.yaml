apiVersion: kargo.akuity.io/v1alpha1
kind: PromotionTask
metadata:
  name: helm-promo
  namespace: kargo-test-app
spec:
  vars:
    - name: gitopsRepo
      value: https://github.com/mario-valente/kargo-demo.git
    - name: imageRepo
      value: kind-registry-tls:5443/kargo-test-app
  steps:
    - uses: git-clone
      config:
        repoURL: ${{ vars.gitopsRepo }}
        checkout:
          - branch: main
            path: ./work
    # Edita só o values.yaml do ambiente sendo promovido (apps/test-app/values/<stage>.yaml).
    # O chart genérico (charts/generic-app) e o values/base.yaml compartilhado nunca são tocados
    # pela promoção — só a tag de imagem do ambiente específico.
    - uses: yaml-update
      as: update
      config:
        path: ./work/apps/test-app/values/${{ ctx.stage }}.yaml
        updates:
          - key: image.tag
            value: ${{ imageFrom(vars.imageRepo).Tag }}
    - uses: git-commit
      as: commit
      config:
        path: ./work
        message: ${{ task.outputs.update.commitMessage }}
    - uses: git-push
      config:
        path: ./work
    # Tag móvel por Stage (ex: non-prod-latest, prod-latest). Como só a promoção
    # DESTE stage move a tag DESTE stage, um commit promovido para prod nunca
    # afeta a tag non-prod-latest — isso evita o problema de "Unhealthy" que
    # ocorre quando várias Applications observam a mesma branch main (o SHA
    # resolvido de main muda a cada commit de qualquer ambiente, mas o SHA da
    # tag só muda quando o próprio ambiente é promovido).
    - uses: git-tag
      config:
        path: ./work
        tag: ${{ ctx.stage }}-latest
        message: Promotion to ${{ ctx.stage }}
        force: true
    - uses: git-push
      config:
        path: ./work
        tag: ${{ ctx.stage }}-latest
    - uses: argocd-update
      config:
        apps:
          - name: test-app-${{ ctx.stage }}
            sources:
              - repoURL: ${{ vars.gitopsRepo }}
                desiredRevision: ${{ task.outputs.commit.commit }}
