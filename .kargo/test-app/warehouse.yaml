apiVersion: kargo.akuity.io/v1alpha1
kind: Warehouse
metadata:
  name: kargo-test-app
  namespace: kargo-test-app
spec:
  subscriptions:
    - image:
        # O pod do Kargo roda dentro do cluster kind-hub e enxerga o registry
        # local pelo nome do container na rede docker "kind" (kind-registry:5000),
        # não por localhost:5001 (isso só funciona no host / via containerd nos nós).
        repoURL: kind-registry:5000/kargo-test-app
        # registry local do kind roda em HTTP, sem TLS
        insecureSkipTLSVerify: true
        constraint: "*"
        discoveryLimit: 10
