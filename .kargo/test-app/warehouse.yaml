apiVersion: kargo.akuity.io/v1alpha1
kind: Warehouse
metadata:
  name: kargo-test-app
  namespace: kargo-test-app
spec:
  subscriptions:
    - image:
        # Kargo exige HTTPS para descoberta; kind-registry:5000 é HTTP puro,
        # então usamos um proxy nginx (kind-registry-tls:5443) que faz TLS
        # termination com certificado self-signed na frente do registry local.
        repoURL: kind-registry-tls:5443/kargo-test-app
        insecureSkipTLSVerify: true
        constraint: "*"
        discoveryLimit: 10
